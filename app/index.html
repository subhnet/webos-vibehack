<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient glow in the colour of the focused dock app; two layers so colours crossfade. -->
  <div id="ambientA" class="ambient"></div>
  <div id="ambientB" class="ambient"></div>

  <!-- Top shelf: the focused dock app's name, above the dock. -->
  <div id="hero"></div>

  <header>
    <div id="leftBlock">
      <div id="greeting"></div>
      <div id="timeRow">
        <span id="clock"></span><span id="ampm"></span><span class="divider"></span><span id="date"></span>
      </div>
      <div id="weather" class="hidden"><span id="weatherIcon"></span><span id="weatherTemp"></span></div>
    </div>
    <div id="topButtons">
      <div class="pill" id="btnInputs">
        <svg viewBox="0 0 24 24"><path d="M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z"/></svg>
        <span>Inputs</span>
      </div>
      <div class="pill" id="btnWifi">
        <svg viewBox="0 0 24 24"><path d="M1,9l2,2c4.97,-4.97 13.030,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"/></svg>
        <span id="wifiLabel">Wi-Fi</span>
      </div>
      <div class="pill" id="btnSettings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.030,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.030,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.030,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
        <span>Settings</span>
      </div>
    </div>
  </header>

  <!-- Everything below the header scrolls together: dock band, tiles and the glass highlight. -->
  <div id="viewport">
    <div id="stage">
      <div id="dockBand"></div>
      <div id="tiles"></div>
      <div id="glass"></div>
    </div>
  </div>

  <!-- Dropdown under the Inputs pill. -->
  <div id="inputsPanel" class="hidden"></div>

  <div id="toast"></div>

  <!-- Volume HUD: briefly shown when TV volume changes -->
  <div id="volumeHud" class="hidden">
    <svg viewBox="0 0 24 24"><path d=""/></svg>
    <div id="volBar"><div id="volFill"></div></div>
    <span id="volNum"></span>
  </div>

  <!-- Sleep timer: overlay opened by Green key -->
  <div id="sleepOverlay" class="hidden">
    <div id="sleepTitle">&#x1F4A4; Sleep Timer</div>
    <div id="sleepPills"></div>
  </div>

  <!-- Sleep ring: top-right corner count-down arc when timer is active -->
  <div id="sleepRing" class="hidden">
    <svg viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
      <circle id="sleepArc" cx="22" cy="22" r="18" fill="none" stroke="#fff" stroke-width="4"
              stroke-dasharray="113.1" stroke-dashoffset="0" stroke-linecap="round"
              transform="rotate(-90 22 22)"/>
    </svg>
    <span id="sleepRingLabel"></span>
  </div>

  <!-- Now-Playing bar: slides up from the bottom when a media app was active -->
  <div id="nowPlaying" class="hidden">
    <div id="npArt"></div>
    <div id="npText">
      <div id="npTitle"></div>
      <div id="npArtist"></div>
    </div>
    <div id="npControls">
      <button id="npPrev">&#x23EE;</button>
      <button id="npPlay">&#x25B6;</button>
      <button id="npNext">&#x23ED;</button>
    </div>
  </div>

  <!-- Quick-Search / Spotlight: Red key -->
  <div id="searchOverlay" class="hidden">
    <div id="searchBox">
      <svg id="searchIcon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="searchInput" type="text" placeholder="Search apps…" autocomplete="off"/>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Folder expand overlay -->
  <div id="folderOverlay" class="hidden">
    <div id="folderTitle"></div>
    <div id="folderGrid"></div>
  </div>

  <!-- Screensaver: full-screen overlay when the launcher is idle -->
  <div id="screensaver">
    <div id="ssClock"></div>
    <div id="ssDate2"></div>
  </div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
